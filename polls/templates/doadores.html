{% extends 'base.html' %}
{% load static %}
{% block conteudo %}
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-center mb-4">Top Doadores</h1>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Posição</th>
                            <th>Nome do Doador</th>
                            <th>Valor Doado</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for doador in doadores %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ doador.nome }}</td>
                            <td>{{ doador.valor }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

{% endblock %}
